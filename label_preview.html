<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualização de Etiqueta Térmica - Mundo Kids</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

        .container {
            max-width: 800px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .header-info {
            text-align: center;
            color: #1f2937;
        }

        .header-info h1 {
            margin: 0 0 8px 0;
            font-size: 24px;
            font-weight: 800;
        }

        .header-info p {
            margin: 0;
            font-size: 14px;
            color: #6b7280;
        }

        /* CONFIGURAÇÃO EXATA DE ETIQUETA BROTHER QL DE 60mm */
        .etiqueta-wrapper {
            background-color: #fff;
            border: 1px solid #000;
            border-radius: 6px;
            width: 60mm;
            height: 30mm;
            box-sizing: border-box;
            padding: 2.2mm 3mm;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -4px rgba(0, 0, 0, 0.05);
            /* Escala no navegador para visualização de alta qualidade */
            transform: scale(2.2);
            margin: 60px 0;
        }

        /* Cabeçalho da etiqueta */
        .etiqueta-header {
            display: flex;
            align-items: center;
            gap: 1.5mm;
            height: 4mm;
        }

        .etiqueta-logo {
            width: 4.2mm;
            height: 4.2mm;
            object-fit: contain;
        }

        .etiqueta-brand {
            font-size: 8.5pt;
            font-weight: 900;
            color: #000;
            letter-spacing: -0.2px;
            text-transform: uppercase;
            line-height: 1;
        }

        /* Nome da criança */
        .child-name {
            font-size: 13.5pt;
            font-weight: 850;
            color: #000;
            text-transform: uppercase;
            letter-spacing: -0.4px;
            margin: 0.8mm 0 0 0;
            line-height: 1.1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        /* Seção do código e indicadores */
        .code-status-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 12mm;
            margin-top: 0.5mm;
        }

        .security-code {
            font-size: 34pt;
            font-weight: 900;
            color: #000;
            line-height: 1;
            letter-spacing: -1px;
            margin: 0;
            display: flex;
            align-items: center;
        }

        .status-indicators {
            display: flex;
            align-items: center;
            gap: 1.8mm;
        }

        /* Ícones vetoriais pretos */
        .status-icon {
            width: 4.8mm;
            height: 4.8mm;
            color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .status-icon svg {
            width: 100%;
            height: 100%;
        }

        /* Divisor */
        .divider {
            height: 0.3mm;
            background-color: #000;
            width: 100%;
            margin-top: 0.8mm;
            margin-bottom: 0.8mm;
        }

        /* Rodapé */
        .footer-row {
            display: flex;
            justify-content: space-between;
            font-size: 6.8pt;
            font-weight: 700;
            color: #000;
            text-transform: uppercase;
            letter-spacing: 0.2px;
            line-height: 1;
            align-items: center;
        }

        /* BOTOES DE CONTROLE */
        .controls {
            display: flex;
            gap: 15px;
            margin-top: 60px;
        }

        .btn {
            background-color: #111827;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 6px -1px rgba(17, 24, 39, 0.2);
        }

        .btn:hover {
            background-color: #1f2937;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background-color: #fff;
            color: #374151;
            border: 1px solid #d1d5db;
            box-shadow: none;
        }

        .btn-secondary:hover {
            background-color: #f9fafb;
            color: #111827;
        }

        /* AJUSTES PARA IMPRESSÃO REAL */
        @media print {
            html, body {
                background-color: #fff;
                margin: 0;
                padding: 0;
            }
            .controls, .header-info, h2 {
                display: none !important;
            }
            .etiqueta-wrapper {
                box-shadow: none !important;
                border: 1px solid #000 !important;
                margin: 0 !important;
                transform: none !important;
                page-break-inside: avoid;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-info">
            <h1>Etiqueta Térmica Brother QL (60mm x 30mm)</h1>
            <p>Layout vetorial de alto contraste otimizado para fitas contínuas de 60mm</p>
        </div>

        <!-- ETIQUETA RENDERIZADA -->
        <div class="etiqueta-wrapper">
            <!-- CABEÇALHO COM LOGO REAL -->
            <div class="etiqueta-header">
                <img class="etiqueta-logo" src="./public/favicon-96x96.png" alt="Mundo Kids Logo">
                <div class="etiqueta-brand">Mundo Kids</div>
            </div>

            <!-- NOME DA CRIANÇA -->
            <h2 class="child-name">Gabriel Santos</h2>
            
            <!-- CÓDIGO E ÍCONES DE STATUS -->
            <div class="code-status-row">
                <span class="security-code">001</span>
                <div class="status-indicators">
                    <!-- Restrição Alimentar (⚠️) -->
                    <div class="status-icon icon-allergy" title="Restrição Alimentar">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/>
                            <line x1="12" y1="9" x2="12" y2="13"/>
                            <line x1="12" y1="17" x2="12.01" y2="17"/>
                        </svg>
                    </div>

                    <!-- Sem Autorização de Imagem (Câmera barrada) -->
                    <div class="status-icon icon-image" title="Sem Autorização de Imagem">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="2" y1="2" x2="22" y2="22"/>
                            <path d="M7 21h10a2 2 0 0 0 2-2V9.4a2 2 0 0 0-.58-1.42l-2.42-2.4A2 2 0 0 0 14.58 5H13m-3.42.58L8.4 6.8H7a2 2 0 0 0-2 2v10.2A2 2 0 0 0 7 21Z"/>
                            <circle cx="12" cy="13" r="3"/>
                        </svg>
                    </div>

                    <!-- Aniversariante (Bolo com vela) -->
                    <div class="status-icon icon-birthday" title="Aniversariante da Semana">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-8a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8"/>
                            <path d="M4 16h16"/>
                            <path d="M12 9V5"/>
                            <path d="M11 3a1 1 0 0 1 2 0v2h-2V3Z"/>
                        </svg>
                    </div>

                    <!-- Necessidade Especial (Wheelchair/Acessibilidade) -->
                    <div class="status-icon icon-special" title="Necessidade Especial / Acessibilidade">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="6" r="3"/>
                            <path d="M6 12h6a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2H9a3 3 0 0 1-3-3v-6"/>
                            <path d="m19 12-4-4"/>
                        </svg>
                    </div>

                    <!-- Visitante (Estrela) -->
                    <div class="status-icon icon-visitor" title="Aluno Visitante">
                        <svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
                            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
                        </svg>
                    </div>
                </div>
            </div>

            <!-- DIVISOR HORIZONTAL -->
            <div class="divider"></div>

            <!-- RODAPÉ DA ETIQUETA -->
            <div class="footer-row">
                <span>Sala 8 a 11 anos</span>
                <span>09/07/2026 09:15</span>
            </div>
        </div>

        <!-- CONTROLES -->
        <div class="controls">
            <button class="btn" onclick="window.print()">Testar Impressão</button>
            <button class="btn btn-secondary" onclick="toggleDemoData()">Alternar Crianças de Teste</button>
        </div>
    </div>

    <script>
        let demoState = 0;
        function toggleDemoData() {
            const nameEl = document.querySelector('.child-name');
            const codeEl = document.querySelector('.security-code');
            const roomEl = document.querySelector('.footer-row span:first-child');
            const indicatorsEl = document.querySelector('.status-indicators');

            if (demoState === 0) {
                nameEl.textContent = 'Melissa Oliveira';
                codeEl.textContent = '042';
                roomEl.textContent = 'Maternal';
                indicatorsEl.innerHTML = `
                    <!-- Sem Autorização de Imagem -->
                    <div class="status-icon icon-image" title="Sem Autorização de Imagem">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="2" y1="2" x2="22" y2="22"/>
                            <path d="M7 21h10a2 2 0 0 0 2-2V9.4a2 2 0 0 0-.58-1.42l-2.42-2.4A2 2 0 0 0 14.58 5H13m-3.42.58L8.4 6.8H7a2 2 0 0 0-2 2v10.2A2 2 0 0 0 7 21Z"/>
                            <circle cx="12" cy="13" r="3"/>
                        </svg>
                    </div>
                    <!-- Aniversariante -->
                    <div class="status-icon icon-birthday" title="Aniversariante da Semana">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-8a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8"/>
                            <path d="M4 16h16"/>
                            <path d="M12 9V5"/>
                            <path d="M11 3a1 1 0 0 1 2 0v2h-2V3Z"/>
                        </svg>
                    </div>
                `;
                demoState = 1;
            } else if (demoState === 1) {
                nameEl.textContent = 'Davi Lucas Silva';
                codeEl.textContent = '108';
                roomEl.textContent = '2 a 3 anos';
                indicatorsEl.innerHTML = `
                    <!-- Restrição Alimentar -->
                    <div class="status-icon icon-allergy" title="Restrição Alimentar">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/>
                            <line x1="12" y1="9" x2="12" y2="13"/>
                            <line x1="12" y1="17" x2="12.01" y2="17"/>
                        </svg>
                    </div>
                    <!-- Visitante -->
                    <div class="status-icon icon-visitor" title="Aluno Visitante">
                        <svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
                            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
                        </svg>
                    </div>
                `;
                demoState = 2;
            } else {
                nameEl.textContent = 'Gabriel Santos';
                codeEl.textContent = '001';
                roomEl.textContent = 'Sala 8 a 11 anos';
                indicatorsEl.innerHTML = `
                    <!-- Restrição Alimentar -->
                    <div class="status-icon icon-allergy" title="Restrição Alimentar">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/>
                            <line x1="12" y1="9" x2="12" y2="13"/>
                            <line x1="12" y1="17" x2="12.01" y2="17"/>
                        </svg>
                    </div>
                    <!-- Sem Autorização de Imagem -->
                    <div class="status-icon icon-image" title="Sem Autorização de Imagem">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="2" y1="2" x2="22" y2="22"/>
                            <path d="M7 21h10a2 2 0 0 0 2-2V9.4a2 2 0 0 0-.58-1.42l-2.42-2.4A2 2 0 0 0 14.58 5H13m-3.42.58L8.4 6.8H7a2 2 0 0 0-2 2v10.2A2 2 0 0 0 7 21Z"/>
                            <circle cx="12" cy="13" r="3"/>
                        </svg>
                    </div>
                    <!-- Aniversariante -->
                    <div class="status-icon icon-birthday" title="Aniversariante da Semana">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-8a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8"/>
                            <path d="M4 16h16"/>
                            <path d="M12 9V5"/>
                            <path d="M11 3a1 1 0 0 1 2 0v2h-2V3Z"/>
                        </svg>
                    </div>
                    <!-- Necessidade Especial -->
                    <div class="status-icon icon-special" title="Necessidade Especial / Acessibilidade">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="6" r="3"/>
                            <path d="M6 12h6a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2H9a3 3 0 0 1-3-3v-6"/>
                            <path d="m19 12-4-4"/>
                        </svg>
                    </div>
                    <!-- Visitante -->
                    <div class="status-icon icon-visitor" title="Aluno Visitante">
                        <svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
                            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
                        </svg>
                    </div>
                `;
                demoState = 0;
            }
        }
    </script>
</body>
</html>
